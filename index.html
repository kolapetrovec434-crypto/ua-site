<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalimanov | UA ONLINE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: #0a0a0a;
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .header h1 { font-size: 24px; margin-bottom: 10px; color: #00d2ff; }
        .links { margin-top: 30px; }
        .btn {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            transition: 0.3s;
        }
        .btn:hover {
            background: rgba(0, 210, 255, 0.2);
            border-color: #00d2ff;
            transform: scale(1.02);
        }
        .btn i { font-size: 20px; margin-right: 15px; color: #00d2ff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Kalimanov Project</h1>
            <p>Official Links</p>
        </div>
        <div class="links">
            <a href="https://ua-online.games/" class="btn" target="_blank">
                <i class="fas fa-gamepad"></i> <span>UA ONLINE - Сайт</span>
            </a>
            <a href="https://t.me/KKalimanov" class="btn" target="_blank">
                <i class="fab fa-telegram"></i> <span>Мій Telegram</span>
            </a>
            <a href="https://sites.google.com/view/uaonline04/" class="btn" target="_blank">
                <i class="fas fa-database"></i> <span>Інфо-Портал 04</span>
            </a>
        </div>
    </div>
</body>
</html>
