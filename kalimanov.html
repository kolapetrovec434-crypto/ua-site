            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
            background-color: var(--dark);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 16px 40px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse at 50% 0%, rgba(0,0,0,0.3) 0%, rgba(5,10,26,0.85) 60%),
                linear-gradient(180deg, rgba(5,10,26,0.6) 0%, rgba(5,10,26,0.92) 100%);
            z-index: 0;
        }

        /* Twinkling stars overlay */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 15% 20%, rgba(0,210,255,0.6) 0%, transparent 100%),
                radial-gradient(1px 1px at 80% 10%, rgba(180,79,255,0.6) 0%, transparent 100%),
                radial-gradient(1.5px 1.5px at 60% 35%, rgba(255,215,0,0.5) 0%, transparent 100%),
                radial-gradient(1px 1px at 30% 60%, rgba(0,255,136,0.4) 0%, transparent 100%),
                radial-gradient(1px 1px at 90% 70%, rgba(0,210,255,0.5) 0%, transparent 100%),
                radial-gradient(2px 2px at 5% 85%, rgba(255,100,100,0.4) 0%, transparent 100%),
                radial-gradient(1px 1px at 70% 90%, rgba(180,79,255,0.5) 0%, transparent 100%);
            z-index: 0;
            pointer-events: none;
            animation: twinkle 4s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 2;
            padding-top: 20px;
        }

        /* ── HEADER ── */
        .header {
            text-align: center;
            margin-bottom: 36px;
        }

        .header-badge {
            display: inline-block;
            font-family: 'Rajdhani', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--cyan);
            background: rgba(0,210,255,0.08);
            border: 1px solid rgba(0,210,255,0.25);
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 14px;
        }

        .header h1 {
            font-family: 'Orbitron', monospace;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff 0%, var(--cyan) 50%, var(--purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            line-height: 1.1;
            margin-bottom: 6px;
        }

        .header-sub {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header-divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyan), var(--purple), transparent);
            margin: 12px auto 0;
            border-radius: 2px;
        }

        /* ── LINKS ── */
        .links { display: flex; flex-direction: column; gap: 14px; }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 16px 20px;
            border-radius: 14px;
            text-decoration: none;
            color: white;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(12px);
        }

        /* Shimmer on idle */
        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
            transform: skewX(-20deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        .btn:hover {
            transform: translateY(-4px) scale(1.01);
            background: rgba(0, 210, 255, 0.12);
            border-color: var(--cyan);
            box-shadow:
                0 0 20px rgba(0,210,255,0.25),
                0 8px 32px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 2;
            position: relative;
        }

        .btn-icon-wrap {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,210,255,0.1);
            border: 1px solid rgba(0,210,255,0.2);
            transition: all 0.35s;
            flex-shrink: 0;
        }

        .btn:hover .btn-icon-wrap {
            background: rgba(0,210,255,0.2);
            border-color: var(--cyan);
            box-shadow: 0 0 12px rgba(0,210,255,0.3);
        }

        .btn i {
            font-size: 18px;
            color: var(--cyan);
            transition: transform 0.3s;
        }

        .btn:hover i { transform: scale(1.15); }

        .btn-text {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .btn-label {
            font-family: 'Orbitron', monospace;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
        }

        .btn-desc {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.5px;
        }

        /* Car SVG animation */
        .car-anim {
            position: absolute;
            right: -90px;
            top: 50%;
            transform: translateY(-50%);
            width: 76px;
            height: auto;
            opacity: 0;
            transition: right 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s;
            z-index: 1;
            filter: drop-shadow(0 0 8px rgba(0,210,255,0.6));
        }

        .btn:hover .car-anim {
            right: 14px;
            opacity: 0.75;
        }

        /* Arrow indicator */
        .btn-arrow {
            position: relative;
            z-index: 2;
            opacity: 0.3;
            transition: opacity 0.3s, transform 0.3s;
            flex-shrink: 0;
        }
        .btn:hover .btn-arrow {
            opacity: 1;
            transform: translateX(3px);
        }
        .btn-arrow i { font-size: 13px; color: var(--cyan); }

        /* ── YouTube variant ── */
        .btn-youtube:hover {
            background: rgba(255, 30, 30, 0.12);
            border-color: #ff4444;
            box-shadow:
                0 0 20px rgba(255,50,50,0.25),
                0 8px 32px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(255,255,255,0.06);
        }
        .btn-youtube:hover .btn-icon-wrap {
            background: rgba(255,50,50,0.15);
            border-color: #ff4444;
            box-shadow: 0 0 12px rgba(255,50,50,0.35);
        }
        .btn-youtube i { color: #ff4444; }
        .btn-youtube:hover i { color: #ff2222; }
        .btn-youtube .car-anim {
            filter: drop-shadow(0 0 8px rgba(255,60,60,0.6));
        }
        .btn-youtube .btn-arrow i { color: #ff4444; }

        /* ── Telegram variant ── */
        .btn-telegram:hover {
            background: rgba(0, 136, 204, 0.12);
            border-color: #0088cc;
            box-shadow:
                0 0 20px rgba(0,136,204,0.25),
                0 8px 32px rgba(0,0,0,0.4);
        }
        .btn-telegram:hover .btn-icon-wrap {
            background: rgba(0,136,204,0.2);
            border-color: #0088cc;
            box-shadow: 0 0 12px rgba(0,136,204,0.4);
        }
        .btn-telegram i { color: #0088cc; }

        /* ── Info Portal variant ── */
        .btn-portal:hover {
            background: rgba(180, 79, 255, 0.12);
            border-color: var(--purple);
            box-shadow:
                0 0 20px rgba(180,79,255,0.25),
                0 8px 32px rgba(0,0,0,0.4);
        }
        .btn-portal:hover .btn-icon-wrap {
            background: rgba(180,79,255,0.15);
            border-color: var(--purple);
            box-shadow: 0 0 12px rgba(180,79,255,0.35);
        }
        .btn-portal i { color: var(--purple); }
        .btn-portal .car-anim {
            filter: drop-shadow(0 0 8px rgba(180,79,255,0.7));
        }
        .btn-portal .btn-arrow i { color: var(--purple); }

        /* ── FOOTER ── */
        .footer {
            text-align: center;
            margin-top: 32px;
            font-size: 11px;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.25);
            text-transform: uppercase;
        }

        .footer span {
            display: inline-block;
            width: 4px; height: 4px;
            border-radius: 50%;
            background: var(--cyan);
            margin: 0 8px;
            vertical-align: middle;
            opacity: 0.5;
        }

        /* ── PULSE RING on load ── */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .header { animation: fadeInUp 0.6s ease both; }
        .btn:nth-child(1) { animation: fadeInUp 0.6s 0.1s ease both; }
        .btn:nth-child(2) { animation: fadeInUp 0.6s 0.2s ease both; }
        .btn:nth-child(3) { animation: fadeInUp 0.6s 0.3s ease both; }
        .btn:nth-child(4) { animation: fadeInUp 0.6s 0.4s ease both; }
        .footer         { animation: fadeInUp 0.6s 0.5s ease both; }
    </style>
</head>
